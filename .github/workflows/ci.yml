name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, dom, fileinfo
          coverage: none

      - name: PHP syntax check
        run: |
          FAILED=0
          for f in $(find app routes database config -name "*.php"); do
            OUT=$(php -l "$f" 2>&1)
            if [ $? -ne 0 ]; then
              echo "$OUT"
              FAILED=1
            fi
          done
          echo "lint files checked: $(find app routes database config -name '*.php' | wc -l)"
          exit $FAILED

      - name: PHPUnit syntax check (tests)
        run: |
          for f in $(find tests -name "*.php"); do
            OUT=$(php -l "$f" 2>&1)
            if [ $? -ne 0 ]; then echo "$OUT"; FAILED=1; fi
          done
          exit ${FAILED:-0}

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, dom, fileinfo, pdo_sqlite, intl, bcmath
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Generate APP_KEY
        run: echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> $GITHUB_ENV

      - name: Run test suite
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: vendor/bin/phpunit --colors=never